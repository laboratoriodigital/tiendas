# CONECTAR UNA TIENDA CON SU HOJA — el segundo paso del alta.
#
# DÓNDE ESTÁ: github.com/laboratoriodigital/tiendas › pestaña Actions › en la
# lista de la izquierda, «conectar» › botón «Run workflow» (a la derecha).
# Enlace directo: https://github.com/laboratoriodigital/tiendas/actions/workflows/conectar.yml
# Lo da también el Diagnóstico de la hoja, y el botón «Conectar» del panel de
# la flota. (Aparece solo cuando este archivo está en `main`.)
#
# ═══ SECRETOS (en este repositorio) ═══
#   ALTA_TOKEN     pone los secretos en la tienda y dispara su montaje.
#   DISPARO_TOKEN  opcional (0.16.0 · 3.4): de grano fino, del dueño de las
#                  tiendas, sobre todos sus repositorios, SOLO *Actions: Read
#                  and write*. Se le pone al maestro como GITHUB_TOKEN para que
#                  Publicar y Actualizar funcionen desde el panel y el menú.
#                  Lo más que permite es disparar flujos de las tiendas.
#   PANEL_URL      opcionales (0.17.0): la web app de la hoja «Panel de
#   PANEL_CLAVE    tiendas» y la clave de su menú › Clave para el alta. Con
#                  ellos, conectar deja la tienda registrada en esa hoja.
#
# TRES CAMPOS, los que da el menú de la hoja › Diagnóstico. Lo demás lo
# averigua (flota/conectar.mjs): la hoja y el proyecto se los pregunta al
# maestro; el repositorio, el comercio y la dirección los sabe flota.json, y
# los escribe en la hoja sin pisar lo que el comercio ya puso. Después pone los
# secretos de la tienda y dispara su primer montaje.
#
# El token se enmascara en el registro. Este repositorio es privado: la página
# de la corrida la ve solo el dueño.
name: conectar

on:
  workflow_dispatch:
    inputs:
      nombre:
        description: 'El nombre corto de la tienda (el mismo del alta)'
        required: true
      maestro_url:
        description: 'La URL del servicio (menú de la hoja › Diagnóstico)'
        required: true
      maestro_token:
        description: 'El token tk-… (menú de la hoja › Diagnóstico)'
        required: true
      # 0.20.2 · AL FINAL (R1). Después de rotar `DISPARO_TOKEN`, el maestro se
      # queda con el anterior: desde la 0.20.2 lo reemplaza solo cuando el
      # guardado ya no sirve, y esta casilla es para el caso en que sí sirve y
      # aun así se quiere cambiar (bitácora 89).
      forzar_permiso:
        description: 'Reemplazar el permiso de GitHub del maestro aunque el que tenga siga sirviendo'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conectar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tapar el token
        env:
          TK: ${{ inputs.maestro_token }}
        run: echo "::add-mask::$TK"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Preguntarle al maestro y escribir en la hoja
        id: tienda
        env:
          NOMBRE: ${{ inputs.nombre }}
          MAESTRO_URL: ${{ inputs.maestro_url }}
          MAESTRO_TOKEN: ${{ inputs.maestro_token }}
          DISPARO_TOKEN: ${{ secrets.DISPARO_TOKEN }}
          FORZAR_PERMISO: ${{ inputs.forzar_permiso }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_CLAVE: ${{ secrets.PANEL_CLAVE }}
        run: node flota/conectar.mjs

      - name: Los secretos de la tienda, y su primer montaje
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN }}
          REPO: ${{ steps.tienda.outputs.repo }}
          URL: ${{ inputs.maestro_url }}
          TK: ${{ inputs.maestro_token }}
          HOJA: ${{ steps.tienda.outputs.hoja_id }}
          SCRIPT: ${{ steps.tienda.outputs.script_id }}
        run: |
          set -e
          printf '%s' "$URL"    | gh secret set MAESTRO_URL   -R "$REPO"
          printf '%s' "$TK"     | gh secret set MAESTRO_TOKEN -R "$REPO"
          printf '%s' "$HOJA"   | gh secret set HOJA_ID       -R "$REPO"
          printf '%s' "$SCRIPT" | gh secret set SCRIPT_ID     -R "$REPO"
          gh workflow run montaje.yml -R "$REPO" -f que=todo
          {
            echo ""
            echo "Secretos puestos (\`MAESTRO_URL\`, \`MAESTRO_TOKEN\`, \`HOJA_ID\`, \`SCRIPT_ID\`) y **primer montaje** disparado."
            echo "Cuando termine en verde, conecta Cloudflare (paso 3 de la lista del alta)."
          } >> "$GITHUB_STEP_SUMMARY"
