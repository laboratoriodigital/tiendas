# CONECTAR UNA TIENDA CON SU HOJA — el segundo paso del alta.
#
# DÓNDE ESTÁ: github.com/laboratoriodigital/tiendas › pestaña Actions › en la
# lista de la izquierda, «conectar» › botón «Run workflow» (a la derecha).
# Enlace directo: https://github.com/laboratoriodigital/tiendas/actions/workflows/conectar.yml
# Lo da también A2_diagnosticoCompleto en el editor del maestro, y el botón «Conectar» del panel de
# la flota. (Aparece solo cuando este archivo está en `main`.)
#
# ═══ SECRETOS (en este repositorio) ═══
#   ALTA_TOKEN     pone los secretos en la tienda y dispara su montaje.
#   DISPARO_TOKEN  opcional (0.16.0 · 3.4): de grano fino, del dueño de las
#                  tiendas, sobre todos sus repositorios, SOLO *Actions: Read
#                  and write*. Se le pone al maestro como GITHUB_TOKEN para que
#                  Publicar y Actualizar funcionen desde el panel y el menú.
#                  Lo más que permite es disparar flujos de las tiendas.
#   PANEL_URL      opcionales (0.17.0): la web app de la hoja «Panel de
#   PANEL_CLAVE    tiendas» y la clave de su menú › Clave para el alta. Con
#                  ellos, conectar deja la tienda registrada en esa hoja.
#
# TRES CAMPOS, los que da A2_diagnosticoCompleto en el editor del maestro (el
# Diagnóstico del menú de la hoja NO enseña el token, a propósito). Lo demás lo
# averigua (flota/conectar.mjs): la hoja y el proyecto se los pregunta al
# maestro; el repositorio, el comercio y la dirección los sabe flota.json, y
# los escribe en la hoja sin pisar lo que el comercio ya puso. Después pone los
# secretos de la tienda y dispara su primer montaje.
#
# El token se enmascara en el registro. Este repositorio es privado: la página
# de la corrida la ve solo el dueño.
name: conectar

on:
  workflow_dispatch:
    inputs:
      nombre:
        description: 'El nombre corto de la tienda (el mismo del alta)'
        required: true
      maestro_url:
        description: 'La URL del servicio (editor del maestro › A2_diagnosticoCompleto)'
        required: true
      maestro_token:
        description: 'El token tk-… (editor del maestro › A2_diagnosticoCompleto)'
        required: true
      # 0.20.2 · AL FINAL (R1). Después de rotar `DISPARO_TOKEN`, el maestro se
      # queda con el anterior: desde la 0.20.2 lo reemplaza solo cuando el
      # guardado ya no sirve, y esta casilla es para el caso en que sí sirve y
      # aun así se quiere cambiar (bitácora 89).
      forzar_permiso:
        description: 'Reemplazar el permiso de GitHub del maestro aunque el que tenga siga sirviendo'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conectar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tapar el token
        env:
          TK: ${{ inputs.maestro_token }}
        run: echo "::add-mask::$TK"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # ── LA FICHA DE LA CORRIDA (0.20.4 · bitácora 91) ─────────────────────
      # La misma de todos los flujos, aquí y en la semilla: qué es esto, sobre
      # qué, cómo está la flota antes de tocar nada y qué se pidió. Una vez,
      # arriba, y ningún paso de abajo lo repite.
      # EL TOKEN NO SE ESCRIBE NI AQUÍ NI EN NINGÚN RESUMEN: se enmascara en el
      # primer paso y lo único que se dice es que llegó.
      - name: Qué es esta corrida
        run: |
          fila=$(NOMBRE='${{ inputs.nombre }}' node -e "
            const f = require('./flota.json');
            const t = f.tiendas.filter(x => x.nombre === process.env.NOMBRE || (x.repo||'').endsWith('/' + process.env.NOMBRE))[0];
            process.stdout.write(t ? '\`' + (t.repo || t.nombre) + '\`, ' + (t.sitio || '') + ', anillo ' + (t.anillo === undefined ? 'sin asignar' : t.anillo)
                                   : 'no está en flota.json todavía');")
          {
            echo "## Conectar ${{ inputs.nombre }} con su hoja"
            echo ""
            echo "Le pregunta al maestro por su hoja y su proyecto, los escribe en la hoja sin pisar"
            echo "lo que el comercio ya puso, pone los secretos en el repositorio de la tienda y"
            echo "dispara su primer montaje."
            echo ""
            echo "|  |  |"
            echo "|---|---|"
            echo "| La tienda | $fila |"
            echo "| Se recibió | la URL del servicio y su token (enmascarado) |"
            echo "| Permiso de GitHub | ${{ inputs.forzar_permiso == true && 'se reemplaza aunque el guardado sirva' || 'se reemplaza solo si el guardado ya no sirve' }} |"
            echo "| Lo pidió | $GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preguntarle al maestro y escribir en la hoja
        id: tienda
        env:
          NOMBRE: ${{ inputs.nombre }}
          MAESTRO_URL: ${{ inputs.maestro_url }}
          MAESTRO_TOKEN: ${{ inputs.maestro_token }}
          DISPARO_TOKEN: ${{ secrets.DISPARO_TOKEN }}
          FORZAR_PERMISO: ${{ inputs.forzar_permiso }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_CLAVE: ${{ secrets.PANEL_CLAVE }}
        run: node flota/conectar.mjs

      - name: Los secretos de la tienda, y su primer montaje
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN }}
          REPO: ${{ steps.tienda.outputs.repo }}
          URL: ${{ inputs.maestro_url }}
          TK: ${{ inputs.maestro_token }}
          HOJA: ${{ steps.tienda.outputs.hoja_id }}
          SCRIPT: ${{ steps.tienda.outputs.script_id }}
          SEMILLA_TOKEN: ${{ secrets.SEMILLA_TOKEN }}
        run: |
          set -e
          printf '%s' "$URL"    | gh secret set MAESTRO_URL   -R "$REPO"
          printf '%s' "$TK"     | gh secret set MAESTRO_TOKEN -R "$REPO"
          printf '%s' "$HOJA"   | gh secret set HOJA_ID       -R "$REPO"
          printf '%s' "$SCRIPT" | gh secret set SCRIPT_ID     -R "$REPO"
          # 0.21.2 · TAMBIÉN EL DE LA SEMILLA, Y CADA VEZ (bitácora 101). `alta`
          # se lo copia a la tienda EL DÍA QUE NACE y nadie lo vuelve a tocar: el
          # día que ese token se rehace —porque venció o porque no alcanzaba a las
          # tiendas nuevas—, cada tienda se queda con el valor viejo y sus
          # actualizaciones dejan de poder traer flujos, sin que nada lo diga.
          # `conectar` es el sitio donde se ponen los permisos de una tienda, así
          # que aquí se refresca: correrlo otra vez vuelve a ser la respuesta.
          refresco="no se tocó (no hay \`SEMILLA_TOKEN\` en tiendas)"
          if [ -n "$SEMILLA_TOKEN" ]; then
            printf '%s' "$SEMILLA_TOKEN" | gh secret set SEMILLA_TOKEN -R "$REPO"
            refresco="puesto al día con el de \`tiendas\`"
          fi
          gh workflow run montaje.yml -R "$REPO" -f que=todo
          {
            echo ""
            echo "Secretos puestos (\`MAESTRO_URL\`, \`MAESTRO_TOKEN\`, \`HOJA_ID\`, \`SCRIPT_ID\`) y **primer montaje** disparado."
            echo "\`SEMILLA_TOKEN\` de la tienda: $refresco."
            echo "Cuando termine en verde, conecta Cloudflare (paso 3 de la lista del alta)."
          } >> "$GITHUB_STEP_SUMMARY"
