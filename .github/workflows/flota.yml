# LA FLOTA (S3 · versión 2: automática)
#
# Dos acciones, a mano desde Actions › flota › Run workflow:
#
#   estado      Una fila por tienda: versión del repositorio, última de su
#               semilla, qué contesta la tienda publicada y si tiene una
#               actualización esperando. Escribe ESTADO.md en este repositorio.
#               También corre sola los lunes, para que la tabla no envejezca.
#
#   actualizar  Pone al día las tiendas de UNA línea hasta el anillo pedido,
#               por anillos, y se detiene si una falla.
#                 · Tienda Panel: dispara el `montaje` de cada tienda con
#                   `semilla: true` (se actualiza sola, prueba todo y vuelve
#                   atrás sola) y espera a que termine.
#                 · Tienda Básica: abre el pull request, espera las pruebas de
#                   la tienda, lo fusiona y dispara su montaje. Salvo si trae
#                   publicar/index.html: ese se queda abierto (flota/actualizar.mjs).
#               De fábrica en ENSAYO: dice qué haría y no toca nada.
#
# ═══ EL SECRETO: FLOTA_TOKEN ═══
# De grano fino, del dueño de las tiendas, con vencimiento. Solo en ESTE
# repositorio. Permisos, sobre los repositorios de la flota (semillas y tiendas):
#   Contents        Read and write   ← leer la semilla, empujar la rama
#   Pull requests   Read and write   ← abrir el pull request
#   Workflows       Read and write   ← la semilla trae .github/workflows/*.yml
#   Actions         Read and write   ← disparar y esperar el montaje de cada tienda
#   Metadata        Read             (obligatorio)
#
# ═══ OPCIONALES: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID ═══
# Con los dos, `estado` publica también `panel/` como Worker de recursos
# estáticos (wrangler.jsonc). El token se crea en Cloudflare › My Profile ›
# API Tokens › Create Token › **Edit Cloudflare Workers**, acotado a esta
# cuenta; el identificador de la cuenta está en el panel de Cloudflare, en
# Workers & Pages › Overview. Sin ellos el flujo no falla: lo dice y sigue.
name: flota

on:
  schedule:
    - cron: '23 12 * * 1'        # lunes 7:23 en Colombia: solo el estado
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        type: choice
        default: estado
        options: [estado, actualizar]
      linea:
        description: 'Línea a actualizar (semilla)'
        type: choice
        default: organico
        options: [organico, tienda]
      anillo:
        description: 'Hasta qué anillo (0 = pruebas, 1 = primeras tiendas, 2 = todas)'
        type: choice
        default: '1'
        options: ['0', '1', '2']
      version:
        description: 'Versión de la semilla (vacío = la última publicada con release)'
        required: false
        default: ''
      ensayo:
        description: 'Ensayo: solo decir qué haría, sin abrir nada'
        type: boolean
        default: true
      tienda:
        description: 'Solo esta tienda (dueño/repositorio); vacío = todas las del anillo'
        required: false
        default: ''
      sin_base:
        description: 'Si no se sabe de qué versión salió una tienda, los archivos distintos…'
        type: choice
        default: dejar
        options: [dejar, sobrescribir]

permissions:
  contents: write

concurrency:
  group: flota
  cancel-in-progress: false

jobs:
  flota:
    runs-on: ubuntu-latest
    # Actualizar espera el montaje de cada tienda, que corre todas las baterías.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # ── LA FICHA DE LA CORRIDA (0.20.4 · bitácora 91) ─────────────────────
      # La misma de todos los flujos, aquí y en la semilla: qué es esto, sobre
      # qué, cómo está la flota antes de tocar nada y qué se pidió. Una vez,
      # arriba, y ningún paso de abajo lo repite.
      - name: Qué es esta corrida
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "${{ inputs.accion }}" = "estado" ]; then
            titulo="El estado de la flota"
            que="Mira cada tienda: qué versión tiene el repositorio, cuál es la última de su semilla, qué"
            que2="contesta la tienda publicada y si tiene una actualización esperando. **No actualiza nada.**"
            pedido="mirar${{ github.event_name == 'schedule' && ' (la revisión de los lunes)' || '' }}"
          else
            titulo="Actualizar la línea ${{ inputs.linea }}, hasta el anillo ${{ inputs.anillo }}"
            que="Pone al día las tiendas de esa línea por anillos —0 pruebas, 1 primeras, 2 todas— y se"
            que2="detiene en cuanto una falla, para que un fallo no se reparta por la flota entera."
            pedido="${{ inputs.ensayo == true && '**ensayo**: dice qué haría y no toca nada' || '**de verdad**' }}"
            pedido="$pedido · versión ${{ inputs.version }}${{ inputs.version == '' && '(la última publicada)' || '' }}"
            [ -n "${{ inputs.tienda }}" ] && pedido="$pedido · solo \`${{ inputs.tienda }}\`"
          fi
          cuantas=$(node -p "require('./flota.json').tiendas.length")
          anillos=$(node -p "
            const t = require('./flota.json').tiendas, c = {};
            t.forEach(x => { const a = x.anillo === undefined || x.anillo === '' ? 'sin anillo' : 'anillo ' + x.anillo; c[a] = (c[a] || 0) + 1; });
            Object.keys(c).sort().map(k => c[k] + ' en ' + k).join(', ')")
          {
            echo "## $titulo"
            echo ""
            echo "$que"
            echo "$que2"
            echo ""
            echo "|  |  |"
            echo "|---|---|"
            echo "| La flota hoy | $cuantas tienda(s): $anillos |"
            echo "| Se pidió | $pedido |"
            echo "| Lo disparó | $GITHUB_ACTOR · \`$GITHUB_EVENT_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Antes de tocar nada: una regla de actualizar rota no llega a abrir un
      # pull request en ninguna tienda.
      - name: Las pruebas de la flota (sin red)
        run: node flota/pruebas.mjs

      - name: ¿Hay con qué?
        env:
          FLOTA_TOKEN: ${{ secrets.FLOTA_TOKEN }}
        run: |
          if [ -z "$FLOTA_TOKEN" ]; then
            {
              echo "### Falta el secreto \`FLOTA_TOKEN\`"
              echo ""
              echo "Ver el encabezado de .github/workflows/flota.yml y el README."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Estado
        if: github.event_name == 'schedule' || inputs.accion == 'estado'
        env:
          FLOTA_TOKEN: ${{ secrets.FLOTA_TOKEN }}
        run: |
          node flota/estado.mjs
          git add -N panel/index.html 2>/dev/null || true
          if ! git diff --quiet -- ESTADO.md panel/index.html; then
            git config user.name  "flota"
            git config user.email "noreply@github.com"
            git add ESTADO.md panel/index.html
            git commit -m "docs/flota: estado de la flota"
            git push
          fi

      # 0.20.0 · PUBLICAR EL PANEL. Cloudflare puede desplegar solo al empujar,
      # si alguien conectó el repositorio en su panel; esto es el otro camino,
      # el que no depende de que nadie lo haya conectado: con un token de
      # Cloudflare en los secretos, el propio flujo publica `panel/`. Sin el
      # token no falla —lo dice y sigue—, porque un panel sin publicar no es
      # una avería: es una tienda menos que mirar desde el navegador.
      - name: Publicar el panel en Cloudflare
        if: github.event_name == 'schedule' || inputs.accion == 'estado'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            {
              echo ""
              echo "_El panel no se publicó: faltan \`CLOUDFLARE_API_TOKEN\` y/o"
              echo "\`CLOUDFLARE_ACCOUNT_ID\` en los secretos de este repositorio (README)._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4 deploy 2>&1 | tail -20 | tee /tmp/cf.txt
          {
            echo ""
            echo "**Panel publicado.** $(grep -o 'https://[^ ]*' /tmp/cf.txt | tail -1)"
            echo ""
            echo "_Protégelo con Cloudflare Access: Zero Trust › Access › Applications › Self-hosted (docs/DESPLIEGUE.md)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Actualizar
        if: github.event_name == 'workflow_dispatch' && inputs.accion == 'actualizar'
        env:
          FLOTA_TOKEN: ${{ secrets.FLOTA_TOKEN }}
          LINEA: ${{ inputs.linea }}
          ANILLO: ${{ inputs.anillo }}
          VERSION: ${{ inputs.version }}
          ENSAYO: ${{ inputs.ensayo }}
          SIN_BASE: ${{ inputs.sin_base }}
          TIENDA: ${{ inputs.tienda }}
        run: node flota/actualizar.mjs
