# EL ALTA DE UNA TIENDA, DESDE AQUÍ
#
# TRES CAMPOS: el nombre corto, el comercio y el producto. Lo demás todavía no
# existe cuando se crea el repositorio —la hoja, el maestro, su token— y se da
# después, en el flujo `conectar` (0.15.0, bitácora 70).
#
# Qué hace:
#   1. Comprueba que el token alcanza a ver la semilla (y si no, lo dice).
#   2. Busca la última versión PUBLICADA de la semilla (su etiqueta vX.Y.Z).
#   3. Crea el repositorio vacío y lo llena CLONANDO esa etiqueta: sin el
#      catálogo, las fotos ni el dominio de la semilla, con su propio nombre de
#      sitio. No hace falta marcar la semilla como «Template repository».
#   4. Permisos de Actions, fusiones automáticas, SEMILLA_TOKEN si existe aquí.
#   5. Su fila en flota.json, y en el resumen la LISTA de lo que falta.
#
# ═══ SECRETOS (solo en este repositorio) ═══
#   FLOTA_TOKEN    (29-sep-2026 · un solo token del dueño en `tiendas`) el mismo
#                  de `flota`, de grano fino, del dueño de las tiendas, sobre
#                  TODOS sus repositorios (el nuevo todavía no existe), con lo
#                  que necesita el alta además de lo suyo: Administration y
#                  Secrets en lectura y escritura (README › Los secretos).
#   ALTA_TOKEN     el de antes, solo para el alta y conectar. Mientras exista,
#                  gana él (`ALTA_TOKEN || FLOTA_TOKEN`); cuando FLOTA_TOKEN ya
#                  tenga esos dos permisos, se borra y no cambia nada más.
#                  Tiene que ser del MISMO dueño donde se crean las tiendas.
#   SEMILLA_TOKEN  opcional: se copia a cada tienda para que se actualice sola.
name: alta

on:
  workflow_dispatch:
    inputs:
      nombre:
        description: 'Nombre corto: minúsculas y guiones. Es el repositorio, el sitio y el subdominio (ej: cafe-la-esquina)'
        required: true
      comercio:
        description: 'El nombre del comercio, como lo verá el comprador'
        required: true
      producto:
        description: 'tienda = Tienda Panel · organico = Tienda Básica'
        type: choice
        default: tienda
        options: [tienda, organico]

permissions:
  contents: write

concurrency:
  group: flota
  cancel-in-progress: false

jobs:
  alta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOMBRE: ${{ inputs.nombre }}
      COMERCIO: ${{ inputs.comercio }}
      LINEA: ${{ inputs.producto }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # ── LA FICHA DE LA CORRIDA (0.20.4 · bitácora 91) ─────────────────────
      # La misma de todos los flujos, aquí y en la semilla: qué es esto, sobre
      # qué, cómo está la flota antes de tocar nada y qué se pidió. Una vez,
      # arriba, y ningún paso de abajo lo repite.
      - name: Qué es esta corrida
        run: |
          cuantas=$(node -p "require('./flota.json').tiendas.length")
          {
            echo "## Alta de ${{ inputs.comercio }}"
            echo ""
            echo "Crea el repositorio **privado** de una tienda nueva y lo llena clonando la última"
            echo "versión publicada de su semilla. Todavía no la conecta con ninguna hoja: eso es el"
            echo "segundo paso, el flujo \`conectar\`."
            echo ""
            echo "|  |  |"
            echo "|---|---|"
            echo "| Se va a crear | \`${{ inputs.nombre }}\` · línea **${{ inputs.producto }}** |"
            echo "| La flota hoy | $cuantas tienda(s) en \`flota.json\` |"
            echo "| Lo pidió | $GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Las pruebas de la flota (sin red)
        run: node flota/pruebas.mjs

      - name: Leer el formulario
        id: datos
        run: node flota/alta.mjs validar

      # EL PRIMER ALTA MURIÓ AQUÍ CON «gh: Not Found (HTTP 404)», que no dice
      # nada. Un 404 de GitHub con un token es casi siempre «este token no ve
      # ese repositorio». Se pregunta antes, y se dice qué revisar.
      # Qué token se usa se dice por su NOMBRE (nunca su valor): con los dos
      # puestos gana ALTA_TOKEN; sin él, FLOTA_TOKEN, que entonces necesita
      # también Administration y Secrets.
      - name: ¿El token alcanza a ver la semilla?
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN || secrets.FLOTA_TOKEN }}
          CUAL: ${{ secrets.ALTA_TOKEN && 'ALTA_TOKEN' || 'FLOTA_TOKEN' }}
          SEMILLA: ${{ steps.datos.outputs.semilla }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "### Falta el secreto \`FLOTA_TOKEN\` (o el antiguo \`ALTA_TOKEN\`). Ver el encabezado de alta.yml." >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "Token del alta: \`$CUAL\`." >> "$GITHUB_STEP_SUMMARY"
          if [ "$CUAL" = "FLOTA_TOKEN" ]; then
            echo "_Sin \`ALTA_TOKEN\`: \`FLOTA_TOKEN\` necesita además *Administration* y *Secrets* en lectura y escritura (README › Los secretos)._" >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! gh api "repos/$SEMILLA" --jq .full_name > /dev/null 2>/tmp/e.txt; then
            {
              echo "### $CUAL no ve la semilla \`$SEMILLA\`"
              echo ""
              echo "GitHub contesta: \`$(head -1 /tmp/e.txt)\`. Casi siempre es una de estas:"
              echo ""
              echo "- El token es de grano fino y **no incluye ese repositorio** (Repository access)."
              echo "- El **dueño del token** (Resource owner) no es \`${SEMILLA%%/*}\`."
              echo "- Venció."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if gh repo view "${{ steps.datos.outputs.repo }}" > /dev/null 2>&1; then
            echo "### Ya existe \`${{ steps.datos.outputs.repo }}\`. No toco nada." >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

      - name: La última versión publicada de la semilla
        id: version
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN || secrets.FLOTA_TOKEN }}
          SEMILLA: ${{ steps.datos.outputs.semilla }}
        run: |
          etiqueta=$(gh api "repos/$SEMILLA/tags?per_page=100" --jq '.[].name' | \
            node -e 'import("./flota/nucleo.mjs").then(m => { const t = require("fs").readFileSync(0, "utf8").split("\n"); process.stdout.write(m.ultimaEtiqueta(t)); })')
          if [ -z "$etiqueta" ]; then
            echo "### La semilla no tiene ninguna versión publicada (etiqueta vX.Y.Z). Corre su **release** primero." >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "etiqueta=$etiqueta" >> "$GITHUB_OUTPUT"
          echo "Semilla $SEMILLA en $etiqueta"

      - name: Crear el repositorio y llenarlo con la semilla
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN || secrets.FLOTA_TOKEN }}
          REPO: ${{ steps.datos.outputs.repo }}
          SEMILLA: ${{ steps.datos.outputs.semilla }}
          ETIQUETA: ${{ steps.version.outputs.etiqueta }}
        run: |
          set -e
          gh repo create "$REPO" --private --description "Tienda en línea de $COMERCIO"
          git clone --quiet --depth 1 --branch "$ETIQUETA" "https://x-access-token:${GH_TOKEN}@github.com/${SEMILLA}.git" nueva
          rm -rf nueva/.git
          DIR=nueva node flota/alta.mjs preparar
          cd nueva
          git init --quiet -b main
          git config user.name "alta"
          git config user.email "noreply@github.com"
          git add -A
          git commit --quiet -m "feature/tienda: nace ${COMERCIO} desde ${SEMILLA} ${ETIQUETA}"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" main

      # TODO AUTOMÁTICO EN LA TIENDA: Actions escribe y abre pull requests, las
      # fusiones automáticas están permitidas y las ramas se limpian solas.
      - name: Permisos y fusiones automáticas
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN || secrets.FLOTA_TOKEN }}
          REPO: ${{ steps.datos.outputs.repo }}
        run: |
          gh api -X PUT "repos/$REPO/actions/permissions/workflow" \
            -f default_workflow_permissions=write -F can_approve_pull_request_reviews=true > /dev/null
          gh api -X PATCH "repos/$REPO" -F allow_squash_merge=true -F allow_auto_merge=true \
            -F delete_branch_on_merge=true > /dev/null

      - name: SEMILLA_TOKEN, si existe aquí
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN || secrets.FLOTA_TOKEN }}
          REPO: ${{ steps.datos.outputs.repo }}
          SEMILLA_TOKEN: ${{ secrets.SEMILLA_TOKEN }}
        run: |
          if [ -n "$SEMILLA_TOKEN" ]; then
            printf '%s' "$SEMILLA_TOKEN" | gh secret set SEMILLA_TOKEN -R "$REPO"
          else
            echo "Sin SEMILLA_TOKEN aquí: la tienda solo podrá leer la semilla si es pública. Sus flujos los entrega la flota igual." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Su fila en flota.json, y lo que falta
        env:
          ETIQUETA: ${{ steps.version.outputs.etiqueta }}
        run: |
          node flota/alta.mjs lista
          node flota/alta.mjs agregar
          node flota/pruebas.mjs > /dev/null
          git config user.name "alta"
          git config user.email "noreply@github.com"
          git add flota.json
          git commit -m "feature/flota: alta de ${{ steps.datos.outputs.repo }}"
          git push
