# EL ALTA DE UNA TIENDA, DESDE AQUÍ (reemplaza a tienda-nueva.yml)
#
# Dos acciones, en este orden:
#
#   crear     El repositorio de la tienda desde la semilla de su línea (Tienda
#             Panel o Tienda Básica), con su propio nombre de sitio, los
#             permisos de Actions, las fusiones automáticas, SEMILLA_TOKEN si
#             existe aquí, y su fila en flota.json. Al terminar, el resumen de
#             la corrida es la LISTA de lo que falta —Google y Cloudflare— con
#             los datos de esta tienda ya puestos.
#
#   conectar  Cuando la hoja y el maestro existen: pone MAESTRO_URL y
#             MAESTRO_TOKEN (y HOJA_ID / SCRIPT_ID si se dan) en el repositorio
#             de la tienda y dispara su primer montaje.
#
# LO QUE NO SE PUEDE HACER DESDE AQUÍ, y por qué:
#   · Google: cada tienda vive en SU cuenta, a propósito (sus propios límites).
#     No hay credencial nuestra que pueda crearle la hoja ni el proyecto.
#   · Cloudflare: conectar un repositorio a Workers es un diálogo del
#     navegador. (Pensado: desplegar con `wrangler` desde Actions y un token de
#     Cloudflare; ver el README, «Lo que viene».)
#
# ═══ LOS SECRETOS (solo en este repositorio) ═══
#   ALTA_TOKEN     de grano fino, del dueño de las tiendas: Administration,
#                  Secrets, Contents y Workflows en lectura y escritura, sobre
#                  todos los repositorios (el de la tienda todavía no existe).
#   SEMILLA_TOKEN  opcional: el que cada tienda Panel usa para actualizarse
#                  sola (leer la semilla y empujar flujos). Si está aquí, el
#                  alta se lo copia a la tienda nueva.
#
# Los valores de `conectar` se ven en la página de la corrida: este repositorio
# es privado y solo lo ve el dueño. Aun así se enmascaran en el registro.
name: alta

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        type: choice
        default: crear
        options: [crear, conectar]
      nombre:
        description: 'Nombre corto: minúsculas y guiones (repositorio, sitio y subdominio). Ej: cafe-la-esquina'
        required: true
      comercio:
        description: 'crear: el nombre del comercio, como lo verá el comprador'
        required: false
      linea:
        description: 'crear: qué producto'
        type: choice
        default: tienda
        options: [tienda, organico]
      subdominio:
        description: 'crear: el subdominio (vacío = el nombre)'
        required: false
      privado:
        description: 'crear: repositorio privado'
        type: boolean
        default: true
      maestro_url:
        description: 'conectar: la URL del servicio (menú de la hoja › Diagnóstico)'
        required: false
      maestro_token:
        description: 'conectar: el token tk-… (menú de la hoja › Diagnóstico)'
        required: false
      hoja_id:
        description: 'conectar (opcional): el ID de la hoja'
        required: false
      script_id:
        description: 'conectar (opcional): el ID del proyecto del maestro'
        required: false

permissions:
  contents: write

concurrency:
  group: flota
  cancel-in-progress: false

jobs:
  alta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Las pruebas de la flota (sin red)
        run: node flota/pruebas.mjs

      - name: ¿Hay con qué?
        env:
          ALTA_TOKEN: ${{ secrets.ALTA_TOKEN }}
        run: |
          if [ -z "$ALTA_TOKEN" ]; then
            echo "### Falta el secreto \`ALTA_TOKEN\`. Ver el encabezado de alta.yml." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ═══════════════════════════ CREAR ═══════════════════════════
      - name: Leer el formulario
        if: inputs.accion == 'crear'
        id: datos
        env:
          NOMBRE: ${{ inputs.nombre }}
          COMERCIO: ${{ inputs.comercio }}
          LINEA: ${{ inputs.linea }}
          SUBDOMINIO: ${{ inputs.subdominio }}
        run: node flota/alta.mjs validar

      - name: Crear el repositorio desde la semilla
        if: inputs.accion == 'crear'
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN }}
          REPO: ${{ steps.datos.outputs.repo }}
          NOMBRE: ${{ steps.datos.outputs.nombre }}
          SEMILLA: ${{ steps.datos.outputs.semilla }}
          COMERCIO: ${{ inputs.comercio }}
        run: |
          set -o pipefail
          if gh repo view "$REPO" > /dev/null 2>&1; then
            echo "Ya existe $REPO. No toco nada." >&2; exit 1
          fi
          # La semilla tiene que estar marcada como «Template repository».
          gh api "repos/$SEMILLA/generate" -f owner="${REPO%%/*}" -f name="$NOMBRE" \
            -f description="Tienda en línea de $COMERCIO" -F private=${{ inputs.privado }} \
            -F include_all_branches=false > /dev/null
          for i in $(seq 1 12); do
            gh api "repos/$REPO/contents/wrangler.jsonc" > /tmp/w.json 2>/dev/null && break
            echo "El repositorio todavía se está creando; espero…"; sleep 5
          done

      # Dos tiendas con el mismo «name» son el mismo Worker: la segunda pisa a
      # la primera. Aquí se pone el suyo antes de que nadie conecte Cloudflare.
      - name: Su propio nombre de sitio
        if: inputs.accion == 'crear'
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN }}
          REPO: ${{ steps.datos.outputs.repo }}
          NOMBRE: ${{ steps.datos.outputs.nombre }}
        run: |
          set -o pipefail
          sha=$(node -pe "require('/tmp/w.json').sha")
          node -e '
            const j = require("/tmp/w.json");
            const t = Buffer.from(j.content, "base64").toString("utf8");
            const n = t.replace(/"name":\s*"[^"]*"/, `"name": "${process.env.NOMBRE}"`);
            if (n === t && !t.includes(`"name": "${process.env.NOMBRE}"`)) { console.error("No encontré name en wrangler.jsonc"); process.exit(1); }
            require("fs").writeFileSync("/tmp/w.b64", Buffer.from(n).toString("base64"));'
          gh api -X PUT "repos/$REPO/contents/wrangler.jsonc" \
            -f message="refactor/frontend: el sitio de esta tienda tiene su propio nombre" \
            -f content="$(cat /tmp/w.b64)" -f sha="$sha" > /dev/null

      # TODO AUTOMÁTICO EN LA TIENDA: Actions escribe y abre pull requests, las
      # fusiones automáticas están permitidas y las ramas se limpian solas.
      - name: Permisos y fusiones automáticas
        if: inputs.accion == 'crear'
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN }}
          REPO: ${{ steps.datos.outputs.repo }}
        run: |
          gh api -X PUT "repos/$REPO/actions/permissions/workflow" \
            -f default_workflow_permissions=write -F can_approve_pull_request_reviews=true > /dev/null
          gh api -X PATCH "repos/$REPO" -F allow_squash_merge=true -F allow_auto_merge=true \
            -F delete_branch_on_merge=true > /dev/null

      - name: SEMILLA_TOKEN, si existe aquí
        if: inputs.accion == 'crear'
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN }}
          REPO: ${{ steps.datos.outputs.repo }}
          SEMILLA_TOKEN: ${{ secrets.SEMILLA_TOKEN }}
        run: |
          if [ -n "$SEMILLA_TOKEN" ]; then
            printf '%s' "$SEMILLA_TOKEN" | gh secret set SEMILLA_TOKEN -R "$REPO"
            echo "SEMILLA_TOKEN puesto: la tienda podrá actualizarse sola, flujos incluidos." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sin SEMILLA_TOKEN aquí: la tienda se actualizará igual, pero sin traer los flujos." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Su fila en flota.json
        if: inputs.accion == 'crear'
        env:
          NOMBRE: ${{ inputs.nombre }}
          COMERCIO: ${{ inputs.comercio }}
          LINEA: ${{ inputs.linea }}
          SUBDOMINIO: ${{ inputs.subdominio }}
          REPO: ${{ steps.datos.outputs.repo }}
        run: |
          node flota/alta.mjs lista
          node flota/alta.mjs agregar
          node flota/pruebas.mjs > /dev/null
          git config user.name "alta"
          git config user.email "noreply@github.com"
          git add flota.json
          git commit -m "feature/flota: alta de $REPO"
          git push

      # ═══════════════════════════ CONECTAR ═══════════════════════════
      - name: Conectar la tienda con su hoja
        if: inputs.accion == 'conectar'
        env:
          GH_TOKEN: ${{ secrets.ALTA_TOKEN }}
          NOMBRE: ${{ inputs.nombre }}
          URL: ${{ inputs.maestro_url }}
          TK: ${{ inputs.maestro_token }}
          HOJA: ${{ inputs.hoja_id }}
          SCRIPT: ${{ inputs.script_id }}
        run: |
          echo "::add-mask::$TK"
          REPO=$(node -p "(require('./flota.json').tiendas.find(t => t.repo.split('/')[1] === process.env.NOMBRE) || {}).repo || ''")
          if [ -z "$REPO" ]; then echo "No hay una tienda «$NOMBRE» en flota.json. ¿Corriste crear?" >&2; exit 1; fi
          case "$URL" in https://script.google.com/macros/s/*/exec) ;; *) echo "La URL tiene que ser la /exec del maestro." >&2; exit 1;; esac
          case "$TK" in tk-*) ;; *) echo "El token empieza por tk-." >&2; exit 1;; esac
          printf '%s' "$URL" | gh secret set MAESTRO_URL -R "$REPO"
          printf '%s' "$TK"  | gh secret set MAESTRO_TOKEN -R "$REPO"
          [ -n "$HOJA" ]   && printf '%s' "$HOJA"   | gh secret set HOJA_ID -R "$REPO"
          [ -n "$SCRIPT" ] && printf '%s' "$SCRIPT" | gh secret set SCRIPT_ID -R "$REPO"
          gh workflow run montaje.yml -R "$REPO" -f que=todo
          {
            echo "### $REPO conectada"
            echo ""
            echo "Secretos puestos y **primer montaje** disparado: trae la hoja y las fotos,"
            echo "hornea la tienda, corre las baterías y publica. Míralo en Actions de \`$REPO\`."
          } >> "$GITHUB_STEP_SUMMARY"
